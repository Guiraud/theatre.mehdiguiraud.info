---
- name: Déploiement du fichier Google Search Console sur le serveur OVH
  hosts: all
  gather_facts: false
  vars:
    web_root: "/home/mehdiguid/theatre"
    theme_dir: "/home/mehdiguid/theatre/wp-content/themes/refoulement"
    verification_file: "google8a0d27bc313a0a0e.html"
    verification_content_b64: "Z29vZ2xlLXNpdGUtdmVyaWZpY2F0aW9uOiBnb29nbGU4YTBkMjdiYzMxM2EwYTBlLmh0bWw="
    functions_php_b64: ""
    seo_php_b64: ""

  tasks:
    - name: Déposer le fichier de vérification à la racine web
      ansible.builtin.raw: "echo '{{ verification_content_b64 }}' | base64 -d > {{ web_root }}/{{ verification_file }}"

    - name: Déposer le fichier de vérification dans le thème
      ansible.builtin.raw: "echo '{{ verification_content_b64 }}' | base64 -d > {{ theme_dir }}/{{ verification_file }}"

    - name: Déployer inc/seo.php dans le thème
      ansible.builtin.raw: "echo '{{ seo_php_b64 }}' | base64 -d > {{ theme_dir }}/inc/seo.php"

    - name: Mettre à jour functions.php dans le thème
      ansible.builtin.raw: "echo '{{ functions_php_b64 }}' | base64 -d > {{ theme_dir }}/functions.php"

    - name: Ajuster les permissions
      ansible.builtin.raw: "chmod 644 {{ web_root }}/{{ verification_file }} {{ theme_dir }}/{{ verification_file }} {{ theme_dir }}/inc/seo.php {{ theme_dir }}/functions.php"

    - name: Vérifier la présence et le contenu du fichier racine
      ansible.builtin.raw: "cat {{ web_root }}/{{ verification_file }}"
      register: cat_output

    - name: Afficher le résultat du fichier déployé
      ansible.builtin.debug:
        var: cat_output.stdout
